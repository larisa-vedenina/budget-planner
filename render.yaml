services:
  - type: web
    name: budget-planner
    runtime: node
    plan: free
    branch: dev_planner
    buildCommand: cd frontend && npm ci && npm run build && cd ../backend && npm install
    startCommand: node backend/server.js
    healthCheckPath: /health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: ALLOWED_ORIGIN
        value: "*"
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_POOL_MAX
        value: "5"
      - key: DATABASE_CONNECTION_TIMEOUT_MS
        value: "10000"
      - key: DATABASE_IDLE_TIMEOUT_MS
        value: "30000"
      - key: GEMINI_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_VERIFY_SERVICE_SID
        sync: false
